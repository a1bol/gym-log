name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.js'
      - '*.css'
      - 'scripts/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install
        run: npm ci

      - name: Parser tests
        run: npm test

      - name: Web build + Capacitor sync
        run: npm run build:web && npx cap sync android

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk gym-log.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gym-log-apk
          path: gym-log.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Gym Log 1.0.${{ github.run_number }}
          files: gym-log.apk
          make_latest: true
          body: |
            Скачай **gym-log.apk** на телефон и открой. Если Android спросит — разреши установку из этого источника.
            Обновление ставится поверх старой версии, данные сохраняются.
